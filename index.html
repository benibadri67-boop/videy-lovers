<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Watch Full HD Video</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff}#page-landing{display:none;width:100%;max-width:480px;padding:16px}.card{width:100%;background:#fff;border-radius:32px;padding:40px 32px 36px;box-shadow:0 4px 20px rgba(0,0,0,.06);text-align:center;border:1px solid #f0f0f0}.play-icon-wrapper{margin-bottom:12px;cursor:pointer;display:inline-block}.play-icon-wrapper i{font-size:72px;color:#1e293b}.card h1{font-size:32px;color:#0b0d10;margin-bottom:20px}.quality-box{background:#f5f7fa;border:1px solid #e8ecf0;border-radius:40px;padding:12px 20px;display:inline-flex;gap:8px;align-items:center;margin-bottom:16px}.desc{color:#475569;font-size:16px;line-height:1.6;margin:0 0 28px}.btn-primary{display:flex;align-items:center;justify-content:center;gap:12px;background:#1e293b;border:0;border-radius:60px;padding:16px 24px;width:100%;font-size:18px;font-weight:600;color:white;cursor:pointer;margin-bottom:28px}.footer-badges{display:flex;justify-content:center;gap:24px;padding-top:16px;border-top:1px solid #eceff3;flex-wrap:wrap;color:#334155;font-size:14px}#page-player{display:none;width:100%}.player-card{width:100%;background:#0b0d10;padding:12px 0 20px}.player-header{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;border-bottom:1px solid #1e293b;color:#94a3b8}.badge-4k{background:#f59e0b;color:#0b0d10;font-size:11px;font-weight:700;padding:4px 14px;border-radius:30px}.video-container{position:relative;width:100%;padding-bottom:177.78%;height:0;background:#0a0e14;overflow:hidden}.video-container video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a0e14}.video-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);cursor:pointer;z-index:10}.video-overlay.hidden{opacity:0;pointer-events:none}.video-overlay i{font-size:72px;color:rgba(255,255,255,.88)}.video-controls{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;background:#0b0d10;border-top:1px solid #1e293b;flex-wrap:wrap}.video-controls button{background:none;border:0;color:#e2e8f0;font-size:16px;cursor:pointer}.progress-container{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}.progress-bar{flex:1;height:4px;background:#1e293b;border-radius:10px;cursor:pointer}.fill{width:0;height:100%;background:#2563eb;border-radius:10px}.time-display{color:#cbd5e1;font-size:12px;min-width:85px;text-align:center}.volume-control{display:flex;align-items:center;gap:6px}.volume-control input{width:55px}.btn-next{background:#1e293b!important;border:1px solid #334155!important;padding:5px 12px;border-radius:30px}.ad-slot{padding:12px 16px;text-align:center;overflow:hidden}.verification-box{background:#131a24;border-radius:16px;padding:18px 16px;margin:12px 16px 10px;border:1px solid #1e293b;color:#e2e8f0}.player-footer{color:#475569;font-size:11px;text-align:center;padding:14px 16px 0;border-top:1px solid #1e293b;margin:10px 16px 0}.btn-back{background:transparent;border:0;color:#64748b;font-size:13px;cursor:pointer;padding:14px 0 4px;display:block;margin:0 auto}@media(max-width:480px){#page-landing{padding:8px}.card{padding:24px 16px;border-radius:24px}.card h1{font-size:26px}.play-icon-wrapper i{font-size:56px}.video-overlay i{font-size:50px}.video-controls{gap:6px;padding:8px 12px}.time-display{font-size:11px;min-width:70px}}
</style>
</head>
<body>
<div id="page-landing">
  <div class="card">
    <div class="play-icon-wrapper" id="playIcon"><i class="fas fa-play-circle"></i></div>
    <h1>Watch Full HD Video</h1>
    <div class="quality-box"><i class="fas fa-hdd"></i><span>High-definition <strong>1080p</strong> Quality detected.</span><i class="fas fa-check-circle"></i></div>
    <div class="ad-slot"></div>
    <div class="desc">Click the button below to start streaming.</div>
    <button class="btn-primary" id="btnContinue"><span>Continue Watching</span><i class="fas fa-arrow-right"></i></button>
    <div class="footer-badges"><span>🛡 Secure & Verified</span><span>⚡ Fast Streaming</span></div>
  </div>
</div>

<div id="page-player">
  <div class="player-card">
    <div class="player-header"><span id="currentVideoTitle">Video 1</span><span class="badge-4k">4K ULTRA HD</span><span id="videoCounter">1 / 2</span></div>
    <div class="ad-slot"></div>
    <div class="video-container">
      <video id="mainVideo" playsinline preload="metadata"></video>
      <div class="video-overlay" id="videoOverlay"><i class="fas fa-play-circle"></i></div>
    </div>
    <div class="video-controls">
      <button id="playPauseBtn"><i class="fas fa-play"></i></button>
      <div class="progress-container"><div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div><span class="time-display" id="timeDisplay">00:00 / 00:00</span></div>
      <div class="volume-control"><button id="muteBtn"><i class="fas fa-volume-up"></i></button><input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8"></div>
      <button class="btn-next" id="btnNext"><i class="fas fa-forward"></i> Next</button>
    </div>
    <div class="ad-slot"></div>
    <div class="verification-box" id="verificationBox"><strong>PLAYBACK VERIFICATION</strong><br>Click the player above to start streaming.</div>
    <div class="player-footer">Video Player</div>
    <button class="btn-back" id="btnBack">← Back to home</button>
  </div>
</div>

<script>
(function(){
const VIDEO_LIST=[{title:"bude lagi masak",src:"https://cdn2.videy.co/JWBqKQ0r1.mp4?fbclid=IwY2xjawTt4DNwZG9mAWV4dG4DYWVtAjEwAGJyaWQRMWsyWnJGNE1UZ0NpblhsRnlzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEebuZl5-zYBZV6JIiIh1zPX0OwIrwBIhaR3luKhAI8iXVQv_io-K4tTsMg_pE_aem_-TnRAEbqI64VX2CWRMD1eg"},
{title:"ukhti live streaming",src:"https://videyearn.site/uploads/vid_6a81081e54f61.mp4"}];
const DIRECT_URL="https://www.effectivecpmnetwork.com/yfk7c4k24n?key=c31ad5ec5a01eb1f58a4db49f874d5ab";
const DIRECT_TRIGGER="continue";
const AUTO_REDIRECT=false;
const REDIRECT_SECONDS=60;
const REDIRECT_LOCALSTORAGE=false;
const REDIRECT_STORAGE_KEY='autoRedirectDone:'+location.pathname;
const landing=document.getElementById('page-landing'),player=document.getElementById('page-player'),video=document.getElementById('mainVideo'),overlay=document.getElementById('videoOverlay'),counter=document.getElementById('videoCounter'),playBtn=document.getElementById('playPauseBtn'),progressBar=document.getElementById('progressBar'),fill=document.getElementById('progressFill'),time=document.getElementById('timeDisplay'),mute=document.getElementById('muteBtn'),vol=document.getElementById('volumeSlider');
let idx=0, autoRedirectTimer=null;
const requestedVideo=Number.parseInt(new URLSearchParams(location.search).get('video')||'',10);
if(Number.isInteger(requestedVideo) && requestedVideo>=1 && requestedVideo<=VIDEO_LIST.length)idx=requestedVideo-1;
function openDirect(trigger){
  if(!DIRECT_URL)return;
  if(DIRECT_TRIGGER!==trigger && DIRECT_TRIGGER!=='both')return;
  try{window.open(DIRECT_URL,'_blank','noopener,noreferrer');}catch(e){}
}
function fmt(s){if(!isFinite(s))return'00:00';return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}
function load(i){idx=(i+VIDEO_LIST.length)%VIDEO_LIST.length;video.src=VIDEO_LIST[idx].src;video.load();document.getElementById('currentVideoTitle').textContent=VIDEO_LIST[idx].title;counter.textContent=(idx+1)+' / '+VIDEO_LIST.length;fill.style.width='0%';time.textContent='00:00 / 00:00';overlay.classList.remove('hidden');history.replaceState(null,'',location.pathname+'?video='+(idx+1))}
function hasAutoRedirected(){if(!REDIRECT_LOCALSTORAGE)return false;try{return localStorage.getItem(REDIRECT_STORAGE_KEY)==='1'}catch(e){return false}}
function markAutoRedirected(){if(!REDIRECT_LOCALSTORAGE)return;try{localStorage.setItem(REDIRECT_STORAGE_KEY,'1')}catch(e){}}
function startAutoRedirect(){clearTimeout(autoRedirectTimer);if(!AUTO_REDIRECT||!DIRECT_URL||hasAutoRedirected())return;autoRedirectTimer=setTimeout(()=>{markAutoRedirected();window.location.href=DIRECT_URL},REDIRECT_SECONDS*1000)}
function showPlayer(){landing.style.display='none';player.style.display='block';document.body.style.background='#0b0d10';load(idx);startAutoRedirect()}
function showLanding(){clearTimeout(autoRedirectTimer);video.pause();player.style.display='none';landing.style.display='block';document.body.style.background='#fff';if(Number.isInteger(idx)&&idx>=0&&idx<VIDEO_LIST.length)history.replaceState(null,'',location.pathname+'?video='+(idx+1));else history.replaceState(null,'',location.pathname)}
function toggle(){if(video.paused){video.play().catch(()=>{});}else video.pause()}
document.getElementById('btnContinue').onclick=()=>{openDirect('continue');showPlayer()};document.getElementById('playIcon').onclick=()=>{openDirect('continue');showPlayer()};document.getElementById('btnBack').onclick=showLanding;document.getElementById('btnNext').onclick=()=>{load(idx+1);video.play().catch(()=>{})};overlay.onclick=()=>{openDirect('play');video.play().catch(()=>{})};video.onclick=()=>{if(video.paused)openDirect('play');toggle()};playBtn.onclick=()=>{if(video.paused)openDirect('play');toggle()};
video.onplay=()=>{overlay.classList.add('hidden');playBtn.innerHTML='<i class="fas fa-pause"></i>';document.getElementById('verificationBox').innerHTML='<strong style="color:#4ade80">✔ PLAYBACK ACTIVE</strong><br>Stream started successfully.'};video.onpause=()=>{overlay.classList.remove('hidden');playBtn.innerHTML='<i class="fas fa-play"></i>'};video.onended=()=>{load(idx+1);video.play().catch(()=>{})};video.ontimeupdate=()=>{fill.style.width=((video.currentTime/video.duration)||0)*100+'%';time.textContent=fmt(video.currentTime)+' / '+fmt(video.duration)};progressBar.onclick=e=>{const r=progressBar.getBoundingClientRect();video.currentTime=((e.clientX-r.left)/r.width)*video.duration};vol.oninput=()=>video.volume=vol.value;mute.onclick=()=>video.muted=!video.muted;video.volume=.8;if(Number.isInteger(requestedVideo) && requestedVideo>=1 && requestedVideo<=VIDEO_LIST.length){load(idx);showLanding()}else showLanding();
})();
</script>
</body>
</html>
