let currentSources = [];
let currentSourceIdx = 0;

if (Number.isInteger(requestedVideo)) {
  const matchIdx = VIDEO_LIST.findIndex(v => v.num === requestedVideo);
  if (matchIdx >= 0) idx = matchIdx;
  else if (requestedVideo >= 1 && requestedVideo <= VIDEO_LIST.length) idx = requestedVideo - 1;
}

function updatePageTitle(newTitle) {
  if (!newTitle) return;
  document.title = newTitle;
  const t = document.getElementById('landingCardTitle');
  if (t) t.textContent = newTitle;
  const vt = document.getElementById('currentVideoTitle');
  if (vt) vt.textContent = newTitle;
}

function fmt(s) {
  if (!isFinite(s)) return '00:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function getProviderName(url) {
  if (!url) return '';
  const lower = url.toLowerCase();
  if (lower.includes('videy.co')) return 'Videy';
  if (lower.includes('aceimg.com')) return 'Aceimg';
  if (lower.includes('slicedrive.com')) return 'Slicedrive';
  if (lower.includes('viorawatch.com') || lower.includes('viora')) return 'Viora';
  if (lower.includes('vidmolo.com') || lower.includes('molovideo.com')) return 'Vidmolo';
  if (lower.includes('catbox.moe')) return 'Catbox';
  if (lower.includes('streamtape.com')) return 'Streamtape';
  if (lower.includes('filemoon')) return 'Filemoon';
  return '';
}

function getAllSources(v) {
  if (!v) return [];
  const list = [];
  if (v.src) list.push(v.src);
  if (Array.isArray(v.alts)) {
    v.alts.forEach(a => {
      const trimmed = String(a || '').trim();
      if (trimmed && !list.includes(trimmed)) list.push(trimmed);
    });
  }
  return list;
}

function isEmbedStream(url) {
  if (!url) return false;
  const lower = url.toLowerCase();
  if (lower.endsWith('.mp4') || lower.endsWith('.webm') || lower.includes('.mp4?') || lower.includes('files.catbox.moe') || lower.includes('litter.catbox.moe') || lower.includes('cdn.videy.co') || lower.includes('cdn.aceimg.com') || lower.includes('cdn.viorawatch.com') || lower.includes('cdn.slicedrive.com')) {
    return false;
  }
  return lower.includes('vidmolo.com') || lower.includes('molovideo.com') || lower.includes('/v?id=') || lower.includes('/e/') || lower.includes('/embed/') || lower.includes('streamtape.com') || lower.includes('dood');
}

function renderServerButtons() {
  if (!serverBar || !serverList) return;
  if (!currentSources || currentSources.length <= 1) {
    serverBar.style.display = 'none';
    serverList.innerHTML = '';
    return;
  }
  serverBar.style.display = 'flex';
  serverList.innerHTML = '';
  currentSources.forEach((srcUrl, sIdx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const isActive = sIdx === currentSourceIdx;
    btn.style.cssText = 'font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;transition:all 0.2s;' +
      (isActive ? 'background:#2563eb;color:#fff;border:1px solid #3b82f6;font-weight:700;' : 'background:#1e293b;color:#cbd5e1;border:1px solid #334155;');
    btn.textContent = 'Server ' + (sIdx + 1);
    btn.onclick = () => {
      if (currentSourceIdx === sIdx) return;
      currentSourceIdx = sIdx;
      playSource(currentSources[currentSourceIdx]);
      renderServerButtons();
    };
    serverList.appendChild(btn);
  });
}

function playSource(currentSrc) {
  if (isEmbedStream(currentSrc)) {
    video.style.display = 'none';
    video.pause();
    if (embedEl) {
      embedEl.style.display = 'block';
      embedEl.src = currentSrc;
    }
    overlay.classList.add('hidden');
    if (controlsEl) controlsEl.style.display = 'none';
  } else {
    if (embedEl) {
      embedEl.style.display = 'none';
      embedEl.src = '';
    }
    video.style.display = 'block';
    if (controlsEl) controlsEl.style.display = 'flex';
    video.src = currentSrc;
    video.load();
    overlay.classList.remove('hidden');
  }
}

function showLanding() {
  video.pause();
  if (embedEl) {
    embedEl.src = '';
    embedEl.style.display = 'none';
  }
  player.style.display = 'none';
  landing.style.display = 'block';
  document.body.style.background = '#fff';
}

function showPlayer() {
  landing.style.display = 'none';
  player.style.display = 'block';
  document.body.style.background = '#0b0d10';
}

function openDirect() {
  if (DIRECT_URLS && DIRECT_URLS.length && !window.__openedAd) {
    window.__openedAd = true;
    const targetAd = DIRECT_URLS[Math.floor(Math.random() * DIRECT_URLS.length)];
    if (targetAd) window.open(targetAd, '_blank');
  }
}

function load(i) {
  if (!VIDEO_LIST.length) return;
  idx = (i + VIDEO_LIST.length) % VIDEO_LIST.length;
  currentSources = getAllSources(VIDEO_LIST[idx]);
  currentSourceIdx = 0;

  playSource(currentSources[0] || '');
  renderServerButtons();

  const current = VIDEO_LIST[idx];
  updatePageTitle(current.title || DEFAULT_TITLE);
  counter.textContent = (idx + 1) + ' / ' + VIDEO_LIST.length;
  fill.style.width = '0%';
  time.textContent = '00:00 / 00:00';
  const targetNum = current.num || (idx + 1);
  history.replaceState(null, '', location.pathname + '?video=' + targetNum);
}

function toggle() {
  if (video.paused) { video.play().catch(() => {}); }
  else { video.pause(); }
}

document.getElementById('btnContinue').onclick = () => { openDirect(); showPlayer(); load(idx); if (!isEmbedStream(currentSources[currentSourceIdx])) video.play().catch(()=>{}); };
document.getElementById('playIcon').onclick = () => { openDirect(); showPlayer(); load(idx); if (!isEmbedStream(currentSources[currentSourceIdx])) video.play().catch(()=>{}); };
document.getElementById('btnBack').onclick = showLanding;
document.getElementById('btnNext').onclick = () => { load(idx + 1); if (!isEmbedStream(currentSources[currentSourceIdx])) video.play().catch(() => {}); };
overlay.onclick = () => { openDirect(); video.play().catch(() => {}); };
video.onclick = () => { if (video.paused) openDirect(); toggle(); };
playBtn.onclick = () => { if (video.paused) openDirect(); toggle(); };

video.onplay = () => {
  overlay.classList.add('hidden');

  document.getElementById('verificationBox').innerHTML = '<strong style="color:#4ade80">✔ STREAMING AKTIF</strong><br>Video berhasil diputar.';
};
video.onpause = () => {
  overlay.classList.remove('hidden');
  playBtn.innerHTML = '<i class="fas fa-play"></i>';
};
video.onended = () => {
  load(idx + 1);

};
video.onerror = () => {
  if (currentSources && currentSourceIdx < currentSources.length - 1) {
    currentSourceIdx++;
    playSource(currentSources[currentSourceIdx]);
    renderServerButtons();
    video.play().catch(() => {});
  }
};
video.ontimeupdate = () => {
  fill.style.width = ((video.currentTime / video.duration) || 0) * 100 + '%';
  time.textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration);
};
progressBar.onclick = e => {
  const r = progressBar.getBoundingClientRect();
  video.currentTime = ((e.clientX - r.left) / r.width) * video.duration;
};
vol.oninput = () => video.volume = vol.value;
mute.onclick = () => video.muted = !video.muted;
video.volume = 0.8;

load(idx);
showLanding();
})();
</script>
</body>
</html>
